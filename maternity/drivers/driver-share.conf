# M.A.R.T.I.N. — Pharmacy Samba Share Configuration
# Place in /etc/samba/smb.conf.d/ or append to /etc/samba/smb.conf

[DellDrivers]
    comment = M.A.R.T.I.N. Dell Driver Cache — Read-Only
    path = /var/lib/maternity/drivers
    browseable = yes
    read only = yes
    guest ok = yes
    public = yes
    force user = nobody
    force group = nogroup
    create mask = 0444
    directory mask = 0555
    veto files = /.cache/.version/
    hide files = /.cache/.version/
    # Only allow hosts on the imaging subnet
    # hosts allow = 192.168.88.0/24
